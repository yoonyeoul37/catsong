# 라디오 편성표 자동 갱신: 매일 한국 시간 새벽 4시쯤 tools/make_schedule.py 실행
# 바뀐 게 있으면 assets/schedule.json 을 GitHub에 올림 (앱은 그 파일을 받아 씀)
name: 라디오 편성표 자동 갱신

on:
  schedule:
    - cron: '0 19 * * *'   # 세계 시간 19시 = 한국 시간 새벽 4시
  workflow_dispatch:         # GitHub 화면에서 직접 눌러 실행하기

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: 편성표 만들기
        run: python3 tools/make_schedule.py
      - name: 바뀐 게 있으면 올리기
        run: |
          if git diff --quiet assets/schedule.json; then
            echo "바뀐 게 없어요"
            exit 0
          fi
          git config user.name "schedule-bot"
          git config user.email "schedule-bot@users.noreply.github.com"
          git add assets/schedule.json
          git commit -m "라디오 편성표 자동 갱신"
          git push