name: mp3_player
description: Local MP3 Player App
publish_to: 'none'
version: 1.0.0+129
environment:
  sdk: ^3.12.0

dependencies:
  flutter:
    sdk: flutter
  flutter_native_splash: ^2.4.0
  just_audio: ^0.9.46
  audio_service: ^0.18.15
  permission_handler: ^11.3.0
  speech_to_text: ^7.0.0
  image_picker: ^1.1.2
  provider: ^6.1.2
  marquee: ^2.2.3
  cupertino_icons: ^1.0.8
  shared_preferences: ^2.3.2
  http: ^1.6.0
  torch_light: ^1.0.0
  url_launcher: ^6.3.0
  video_player: ^2.9.2
  chewie: ^1.8.5
  share_plus: ^10.0.0
  flutter_colorpicker: ^1.1.0
  google_fonts: ^8.1.0
  media_kit: ^1.1.11
  media_kit_libs_android_video: ^1.0.5
  wakelock_plus: ^1.2.8
  connectivity_plus: ^6.0.0
  audio_session: ^0.1.21
  flutter_localizations:
    sdk: flutter
  intl: ^0.20.2
  flutter_svg: ^2.0.10
  in_app_update: ^5.0.0
  flutter_tts: ^4.0.2
  cached_network_image: ^3.4.1
  record: ^7.1.1
  firebase_core: ^4.15.0
  firebase_crashlytics: ^5.4.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.3

flutter_launcher_icons:
  android: true
  ios: false
  image_path: "assets/app_icon.png"
  adaptive_icon_background: "#FFFFFF"
  adaptive_icon_foreground: "assets/app_icon.png"
  min_sdk_android: 21

flutter:
  uses-material-design: true
  generate: true
  fonts:
    - family: SpoqaHanSansNeo
      fonts:
        - asset: assets/fonts/SpoqaHanSansNeo-Light.ttf
          weight: 300
        - asset: assets/fonts/SpoqaHanSansNeo-Regular.ttf
          weight: 400
        - asset: assets/fonts/SpoqaHanSansNeo-Medium.ttf
          weight: 500
        - asset: assets/fonts/SpoqaHanSansNeo-Bold.ttf
          weight: 700


  assets:




    - assets/no_album.svg
    - assets/no_album2.jpg
    - assets/no_album3.jpg
    - assets/no_album4.jpg
    - assets/radio_mood_bg.jpg

    - assets/farewell_ko_v4.mp3
    - assets/welcome_ko_v4.mp3

    - assets/music_night_bg.png
    - assets/intro_photo_ko.png
    - assets/intro_photo_en.png
    - assets/intro_photo_ja.png
    - assets/intro_photo_zh.png

    - assets/intro_photo_ko.png
    - assets/intro_photo_en.png
    - assets/intro_photo_ja.png
    - assets/intro_photo_zh.png



    - assets/music_bg.jpg
    - assets/radio_bg.jpg
    - assets/nature_bg.jpg
    - assets/sleep_bg.jpg
    - assets/sound_rain.jpg
    - assets/sound_wave.jpg
    - assets/sound_fire.jpg
    - assets/exit_banner.jpg
    - assets/exit_banner_night.jpg
    - assets/update_banner.jpg
    - assets/review_banner.jpg

flutter_native_splash:
  color: "#17140F"                  # 다크/라이트 상관없이 어두운 바탕 (첫인사 사진과 자연스럽게)
  color_dark: "#17140F"
  image: assets/splash_logo.png     # 오래된 폰(안드로이드 11 이하): 가운데 둥근 아이콘
  android_12:
    color: "#17140F"
    color_dark: "#17140F"
    image: assets/splash_logo.png   # 안드로이드 12 이상도 둥근 네모 아이콘 (동그라미 안에 쏙 → 안 잘림)
    icon_background_color: "#17140F"       # 동그라미 배경을 바탕색과 같게 (잘린 티 안 나게)
    icon_background_color_dark: "#17140F"