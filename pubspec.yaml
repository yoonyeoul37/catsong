name: mp3_player
description: Local MP3 Player App
publish_to: 'none'
version: 1.0.0+79

environment:
  sdk: ^3.12.0

dependencies:
  flutter:
    sdk: flutter
  flutter_native_splash: ^2.4.0
  just_audio: ^0.9.46
  audio_service: ^0.18.15
  permission_handler: ^11.3.0
  provider: ^6.1.2
  marquee: ^2.2.3
  cupertino_icons: ^1.0.8
  shared_preferences: ^2.3.2
  http: ^1.6.0
  torch_light: ^1.0.0
  url_launcher: ^6.3.0
  video_player: ^2.9.2
  chewie: ^1.8.5
  share_plus: ^10.0.0
  flutter_colorpicker: ^1.1.0
  google_fonts: ^8.1.0
  media_kit: ^1.1.11
  media_kit_libs_android_video: ^1.0.5
  wakelock_plus: ^1.2.8
  connectivity_plus: ^6.0.0
  audio_session: ^0.1.21
  flutter_localizations:
    sdk: flutter
  intl: ^0.20.2
  flutter_svg: ^2.0.10
  in_app_update: ^5.0.0
  flutter_tts: ^4.0.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.3

flutter_launcher_icons:
  android: true
  ios: false
  image_path: "assets/play_song.png"
  adaptive_icon_background: "#1A1A1A"
  adaptive_icon_foreground: "assets/icon_no_bg.png"
  min_sdk_android: 21

flutter:
  uses-material-design: true
  generate: true
  fonts:
    - family: SpoqaHanSansNeo
      fonts:
        - asset: assets/fonts/SpoqaHanSansNeo-Light.ttf
          weight: 300
        - asset: assets/fonts/SpoqaHanSansNeo-Regular.ttf
          weight: 400
        - asset: assets/fonts/SpoqaHanSansNeo-Medium.ttf
          weight: 500
        - asset: assets/fonts/SpoqaHanSansNeo-Bold.ttf
          weight: 700

  assets:
    - assets/play_song.png
    - assets/icon_no_bg.png
    - assets/cat.png
    - assets/no_album.png
    - assets/cat_icon.png
    - assets/no_album.svg
    - assets/no_album2.jpg
    - assets/radio_mood_bg.jpg
    - assets/wave_sound.mp3
    - assets/rain_sound.mp3
    - assets/bird_sound.mp3
    - assets/campfire_sound.mp3
    - assets/stream_sound.mp3
    - assets/farewell_ko_v3.mp3
    - assets/farewell_en.mp3
    - assets/farewell_ja.mp3
    - assets/farewell_zh.mp3
    - assets/welcome_ko_v3.mp3
    - assets/paransori_logo.png
    - assets/home_logo.png
    - assets/intro_photo.png
    - assets/campfire_bg.png
    - assets/farewell_bg.png
    - assets/music_bg.png
    - assets/radio_bg.png
    - assets/nature_bg.png
    - assets/sleep_bg.png
    - assets/sound_rain.png
    - assets/sound_wave.png
    - assets/sound_fire.png

flutter_native_splash:
  color: "#F7F5F0"
  color_dark: "#17140F"
  android_12:
    color: "#F7F5F0"
    color_dark: "#17140F"