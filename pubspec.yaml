name: mp3_player
description: Local MP3 Player App
publish_to: 'none'
version: 1.0.0+172
environment:
  sdk: ^3.12.0

dependencies:
  flutter:
    sdk: flutter
  flutter_native_splash: ^2.4.0
  just_audio: ^0.9.46
  audio_service: ^0.18.15
  permission_handler: ^11.3.0
  speech_to_text: ^7.0.0
  image_picker: ^1.1.2
  provider: ^6.1.2
  marquee: ^2.2.3
  cupertino_icons: ^1.0.8
  shared_preferences: ^2.3.2
  http: ^1.6.0
  torch_light: ^1.0.0
  url_launcher: ^6.3.0
  video_player: ^2.9.2
  chewie: ^1.8.5
  share_plus: ^10.0.0
  flutter_colorpicker: ^1.1.0
  google_fonts: ^8.1.0
  media_kit: ^1.1.11
  media_kit_libs_android_video: ^1.0.5
  wakelock_plus: ^1.2.8
  connectivity_plus: ^6.0.0
  audio_session: ^0.1.21
  flutter_localizations:
    sdk: flutter
  intl: ^0.20.2
  flutter_svg: ^2.0.10
  in_app_update: ^5.0.0
  flutter_tts: ^4.0.2
  cached_network_image: ^3.4.1
  record: ^7.1.1
  firebase_core: ^4.15.0
  firebase_crashlytics: ^5.4.0
  device_info_plus: ^12.4.0
  package_info_plus: ^9.0.1
  webview_flutter: ^4.14.1
  webview_flutter_android: ^4.14.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.3

flutter_launcher_icons:
  android: true
  ios: false
  image_path: "assets/app_icon.png"
  adaptive_icon_background: "#FFFFFF"
  adaptive_icon_foreground: "assets/app_icon.png"
  min_sdk_android: 21

flutter:
  uses-material-design: true
  generate: true
  fonts:
    - family: SpoqaHanSansNeo
      fonts:
        - asset: assets/fonts/SpoqaHanSansNeo-Light.ttf
          weight: 300
        - asset: assets/fonts/SpoqaHanSansNeo-Regular.ttf
          weight: 400
        - asset: assets/fonts/SpoqaHanSansNeo-Medium.ttf
          weight: 500
        - asset: assets/fonts/SpoqaHanSansNeo-Bold.ttf
          weight: 700
    - family: LINESeedKR
      fonts:
        - asset: assets/fonts/LINESeedKR-Regular.otf
        - asset: assets/fonts/LINESeedKR-Bold.otf
          weight: 700
    # 설정 → 글꼴 (자주 쓰는 한글 2,350자 + 영문만 남긴 가벼운 버전)
    - family: Pretendard
      fonts:
        - asset: assets/fonts/Pretendard-Regular.ttf
        - asset: assets/fonts/Pretendard-Bold.ttf
          weight: 700
    - family: NanumSquareRound
      fonts:
        - asset: assets/fonts/NanumSquareRound-Regular.ttf
        - asset: assets/fonts/NanumSquareRound-Bold.ttf
          weight: 700
    - family: GowunDodum
      fonts:
        - asset: assets/fonts/GowunDodum-Regular.ttf
    - family: MaruBuri
      fonts:
        - asset: assets/fonts/MaruBuri-Regular.ttf
        - asset: assets/fonts/MaruBuri-Bold.ttf
          weight: 700
    - family: SUIT
      fonts:
        - asset: assets/fonts/SUIT-Regular.ttf
        - asset: assets/fonts/SUIT-Bold.ttf
          weight: 700
    - family: WantedSans
      fonts:
        - asset: assets/fonts/WantedSans-Regular.ttf
        - asset: assets/fonts/WantedSans-Bold.ttf
          weight: 700
    - family: NanumGothic
      fonts:
        - asset: assets/fonts/NanumGothic-Regular.ttf
        - asset: assets/fonts/NanumGothic-Bold.ttf
          weight: 700
    - family: IBMPlexSansKR
      fonts:
        - asset: assets/fonts/IBMPlexSansKR-Regular.ttf
        - asset: assets/fonts/IBMPlexSansKR-Bold.ttf
          weight: 700


  assets:





